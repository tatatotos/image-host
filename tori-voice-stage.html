<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>TORI VOICE STAGE</title><style>html,body{margin:0;background:#020913;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}body{min-height:100vh}.wrap{max-width:900px;margin:auto;padding:18px}.title{font-size:34px;font-weight:1000;letter-spacing:-1px}.sub{color:#8bbbd4;margin:6px 0 16px}.songs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.song{white-space:nowrap;border:1px solid #214b66;background:#0a2031;color:#dff8ff;border-radius:999px;padding:10px 14px;font-weight:800}.song.active{background:#58efff;color:#03131d}.player{position:relative;padding-top:56.25%;margin-top:10px;border-radius:18px;overflow:hidden;background:#000}.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.panel{margin-top:12px;padding:14px;border:1px solid #163f58;border-radius:16px;background:#061724}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.big{font-size:30px;font-weight:1000;color:#59efff}.muted{color:#86a8be;font-size:12px}.meter{height:12px;background:#0b2a3d;border-radius:999px;overflow:hidden;margin:10px 0}.meter>i{display:block;height:100%;width:0;background:#59efff}.score{font-size:28px;font-weight:1000}.btn{width:100%;border:0;border-radius:14px;padding:14px;background:#59efff;color:#02131d;font-weight:1000;font-size:17px;margin-top:12px}.hint{font-size:12px;color:#9ec7dc;line-height:1.5;margin-top:8px}.warn{color:#ffd36a}.chart{height:180px;width:100%;background:#020b13;border-radius:14px;margin-top:12px;display:block}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#10324a;color:#aeeeff;font-size:11px;font-weight:800}.footer{font-size:11px;color:#5f8298;margin:14px 0 30px;line-height:1.5}</style></head><body><div class="wrap"><div class="title">TORI VOICE STAGE</div><div class="sub">유튜브 노래방 반주 + 실시간 보컬 분석 샘플</div><div class="songs" id="songs"></div><div class="player"><iframe id="yt" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><div class="panel"><div class="row"><div><span class="badge" id="status">마이크 대기</span><div class="big" id="note">--</div><div class="muted" id="hz">0 Hz</div></div><div style="text-align:right"><div class="muted">LIVE SCORE</div><div class="score" id="score">0</div><div class="muted" id="detail">안정도 0 · 음역 0</div></div></div><div class="meter"><i id="level"></i></div><canvas class="chart" id="cv"></canvas><button class="btn" id="mic">🎤 마이크 분석 시작</button><div class="hint"><span class="warn">현재 샘플:</span> 유튜브 반주와 함께 부르면 실시간 음정, 입력 레벨, 음정 안정도와 음역을 분석합니다. 아직 원곡 멜로디와 1:1 비교하는 정밀 채점은 아닙니다.</div></div><div class="footer">반주는 각 제공자의 YouTube 영상으로 재생됩니다. 아이폰에서는 Safari에서 열고 마이크 권한을 허용해 주세요.</div></div><script>
const songs=[
 {t:'아이유 - 좋은 날',id:'NbmtT4n2hyk'},
 {t:'아이유 - 너랑 나',id:'A5-tvme6Bn8'},
 {t:'아이유 메들리',id:'b7sDVTIC5m0'}
];
let current=0;const songsEl=document.getElementById('songs'),yt=document.getElementById('yt');
function loadSong(i){current=i;yt.src='https://www.youtube.com/embed/'+songs[i].id+'?playsinline=1&rel=0';[...songsEl.children].forEach((b,n)=>b.classList.toggle('active',n===i))}
songs.forEach((s,i)=>{const b=document.createElement('button');b.className='song';b.textContent=s.t;b.onclick=()=>loadSong(i);songsEl.appendChild(b)});loadSong(0);
let ac,an,buf,history=[],voiced=0,total=0,minM=999,maxM=-999,stabilitySum=0,lastM=null;
const noteEl=document.getElementById('note'),hzEl=document.getElementById('hz'),levelEl=document.getElementById('level'),scoreEl=document.getElementById('score'),detailEl=document.getElementById('detail'),statusEl=document.getElementById('status'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];const hz2m=f=>69+12*Math.log2(f/440);const name=m=>names[((m%12)+12)%12]+(Math.floor(m/12)-1);
function fit(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',fit);fit();
function pitch(a,sr){let n=a.length,rms=0;for(let i=0;i<n;i++)rms+=a[i]*a[i];rms=Math.sqrt(rms/n);if(rms<.01)return[-1,rms];let best=0,lag0=-1,min=Math.floor(sr/900),max=Math.min(Math.floor(sr/70),n-2);for(let lag=min;lag<=max;lag+=2){let c=0;for(let i=0;i<n-lag;i+=2)c+=a[i]*a[i+lag];if(c>best){best=c;lag0=lag}}if(lag0<0)return[-1,rms];let f=sr/lag0;return[(f>=70&&f<=900)?f:-1,rms]}
function draw(){let w=cv.clientWidth,h=cv.clientHeight;ctx.clearRect(0,0,w,h);ctx.strokeStyle='rgba(100,220,255,.12)';for(let y=20;y<h;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}if(history.length<2)return;let vals=history.filter(x=>x>0);if(!vals.length)return;let lo=Math.min(...vals)-2,hi=Math.max(...vals)+2;ctx.strokeStyle='#59efff';ctx.lineWidth=3;ctx.beginPath();history.forEach((m,i)=>{if(m<=0)return;let x=i/(history.length-1)*w,y=h-(m-lo)/(hi-lo)*h;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke()}
async function startMic(){try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});ac=new (AudioContext||webkitAudioContext)();await ac.resume();an=ac.createAnalyser();an.fftSize=2048;ac.createMediaStreamSource(stream).connect(an);buf=new Float32Array(an.fftSize);statusEl.textContent='마이크 연결됨';loop()}catch(e){statusEl.textContent='마이크 실패';alert('Safari에서 마이크 권한을 허용해 주세요.')}}
function loop(){an.getFloatTimeDomainData(buf);let [f,rms]=pitch(buf,ac.sampleRate);levelEl.style.width=Math.min(100,rms*700)+'%';total++;if(f>0){voiced++;let m=hz2m(f);noteEl.textContent=name(Math.round(m));hzEl.textContent=f.toFixed(1)+' Hz';minM=Math.min(minM,m);maxM=Math.max(maxM,m);if(lastM!==null)stabilitySum+=Math.max(0,100-Math.abs(m-lastM)*28);lastM=m;history.push(m)}else{noteEl.textContent='--';hzEl.textContent='0 Hz';history.push(-1)}if(history.length>160)history.shift();let coverage=total?voiced/total*100:0,stability=voiced>1?stabilitySum/(voiced-1):0,range=(maxM>minM&&minM<900)?maxM-minM:0,score=Math.round(Math.min(100,coverage*.45+stability*.45+Math.min(10,range)*1));scoreEl.textContent=score;detailEl.textContent='안정도 '+Math.round(stability)+' · 음역 '+range.toFixed(1)+' semitone';draw();requestAnimationFrame(loop)}
document.getElementById('mic').onclick=startMic;
</script></body></html>
