name: Analyze Good Day Reference

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-good-day.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install yt-dlp numpy scipy librosa soundfile

      - name: Download YouTube audio
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://www.youtube.com/watch?v=2stwr_olRDw'
          rm -f goodday.*
          yt-dlp --no-playlist --extract-audio --audio-format wav --audio-quality 0 \
            --extractor-args 'youtube:player_client=web_safari,android' \
            -o 'goodday.%(ext)s' "$URL" || \
          yt-dlp --no-playlist --extract-audio --audio-format wav --audio-quality 0 \
            -o 'goodday.%(ext)s' "$URL"
          test -f goodday.wav

      - name: Build pitch and timing reference
        run: |
          cat > /tmp/analyze.py <<'PY'
          import json, math
          import numpy as np
          import librosa

          VIDEO_ID = '2stwr_olRDw'
          y, sr = librosa.load('goodday.wav', sr=22050, mono=True)
          # Keep pitched/harmonic material and suppress much of the percussion.
          yh = librosa.effects.harmonic(y, margin=2.0)
          fmin = librosa.note_to_hz('C2')
          fmax = librosa.note_to_hz('C7')
          hop = 256
          f0, voiced, prob = librosa.pyin(
              yh, fmin=fmin, fmax=fmax, sr=sr,
              frame_length=2048, hop_length=hop,
              fill_na=np.nan
          )
          times = librosa.frames_to_time(np.arange(len(f0)), sr=sr, hop_length=hop)
          rms = librosa.feature.rms(y=y, frame_length=2048, hop_length=hop, center=True)[0]
          rms_thr = max(float(np.percentile(rms, 28)), 0.006)

          frames=[]
          for t,hz,v,p,r in zip(times,f0,voiced,prob,rms):
              if not np.isfinite(hz) or not bool(v) or float(p or 0) < 0.52 or float(r) < rms_thr:
                  frames.append((float(t), None, float(p or 0)))
                  continue
              midi=float(librosa.hz_to_midi(hz))
              if midi < 36 or midi > 96:
                  frames.append((float(t), None, float(p or 0)))
                  continue
              frames.append((float(t), int(round(midi)), float(p or 0)))

          # median smooth pitch classes over ~90 ms
          vals=[x[1] for x in frames]
          sm=[]
          for i,m in enumerate(vals):
              cand=[v for v in vals[max(0,i-3):min(len(vals),i+4)] if v is not None]
              sm.append(int(round(float(np.median(cand)))) if cand else None)

          notes=[]
          cur=None
          frame_dt=hop/sr
          for i,m in enumerate(sm):
              t=frames[i][0]
              if m is None:
                  if cur and t-cur['start'] >= 0.12:
                      cur['end']=t
                      notes.append(cur)
                  cur=None
                  continue
              if cur is None:
                  cur={'start':t,'end':t+frame_dt,'pitch':m,'samples':1}
                  continue
              if abs(m-cur['pitch']) <= 1 and t-cur['end'] < 0.12:
                  cur['pitch']=int(round((cur['pitch']*cur['samples']+m)/(cur['samples']+1)))
                  cur['samples']+=1
                  cur['end']=t+frame_dt
              else:
                  if cur['end']-cur['start'] >= 0.12:
                      notes.append(cur)
                  cur={'start':t,'end':t+frame_dt,'pitch':m,'samples':1}
          if cur and cur['end']-cur['start'] >= 0.12:
              notes.append(cur)

          # merge same-note fragments separated by tiny gaps
          merged=[]
          for n in notes:
              n={k:n[k] for k in ('start','end','pitch')}
              if merged and merged[-1]['pitch']==n['pitch'] and n['start']-merged[-1]['end'] < 0.15:
                  merged[-1]['end']=n['end']
              else:
                  merged.append(n)
          merged=[n for n in merged if n['end']-n['start'] >= 0.13]

          # Round for compact transfer.
          for n in merged:
              n['start']=round(float(n['start']),3)
              n['end']=round(float(n['end']),3)
              n['pitch']=int(n['pitch'])

          out={
              'version':1,
              'videoId':VIDEO_ID,
              'source':'github-actions-youtube-audio-pyin',
              'duration':round(len(y)/sr,3),
              'noteCount':len(merged),
              'offset':0.0,
              'notes':merged
          }
          with open('good-day-2stwr_olRDw.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          print('duration',out['duration'],'notes',out['noteCount'])
          if len(merged) < 40:
              raise SystemExit('Too few notes extracted')
          PY
          python /tmp/analyze.py

      - name: Commit reference JSON
        run: |
          git config user.name 'tori-voice-stage-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add good-day-2stwr_olRDw.json
          git diff --cached --quiet && exit 0
          git commit -m 'Generate Good Day pitch reference'
          git push
